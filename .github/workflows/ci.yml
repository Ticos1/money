# Checagens rápidas a cada alteração: testes, banco de conteúdo e sintaxe do painel.
name: Testes

on:
  push:
    branches-ignore: [media]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Validar banco de conteúdo contra a Bíblia
        run: python -m app.validate
      - name: Testes
        run: python -m unittest -v
      - name: Sintaxe do painel
        run: for f in $(find dashboard -name '*.js'); do node --check "$f"; done
