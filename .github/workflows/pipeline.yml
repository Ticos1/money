# Pipeline diário: gera os posts, salva o estado, publica as mídias e o painel.
#
# Roda sozinho todo dia (schedule) e também pode ser disparado:
#  - pelo painel (botão "Gerar agora" e edição de post → re-render)
#  - manualmente em Actions → "Pipeline de conteúdo" → Run workflow
#  - automaticamente quando o código do painel muda (deploy)
name: Pipeline de conteúdo

on:
  schedule:
    - cron: "17 8 * * *" # 05:17 no horário de Brasília (08:17 UTC)
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/pipeline.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "O que fazer"
        type: choice
        options: [generate, rerender, deploy]
        default: generate
      post_id:
        description: "ID do post (só para rerender)"
        type: string
        default: ""
      force:
        description: "Refazer posts do dia que já existem?"
        type: choice
        options: ["false", "true"]
        default: "false"
      date:
        description: "Data AAAA-MM-DD (vazio = hoje)"
        type: string
        default: ""

# Uma execução por vez: evita duas gerações gravando ao mesmo tempo.
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODE: ${{ github.event_name == 'schedule' && 'generate' || (github.event_name == 'push' && 'deploy' || inputs.mode) }}
      POST_ID: ${{ inputs.post_id }}
      FORCE: ${{ inputs.force == 'true' && '--force' || '' }}
      GEN_DATE: ${{ inputs.date }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg e dependências
        if: env.MODE != 'deploy'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          pip install -q -r requirements.txt

      - name: Baixar mídias atuais (branch "media")
        run: |
          mkdir -p media_repo/media
          if git fetch -q --depth 1 origin media; then
            git archive FETCH_HEAD | tar -x -C media_repo
          else
            echo "Branch media ainda não existe (primeira execução)."
          fi

      - name: Gerar posts do dia
        if: env.MODE == 'generate'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m app.generate build --media-dir media_repo/media --out "$RUNNER_TEMP/patch.json" \
            ${GEN_DATE:+--date "$GEN_DATE"} $FORCE

      - name: Re-renderizar post editado
        if: env.MODE == 'rerender'
        run: python -m app.generate rerender --post-id "$POST_ID" --media-dir media_repo/media --out "$RUNNER_TEMP/patch.json"

      - name: Salvar estado no repositório
        if: env.MODE != 'deploy'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # O painel também grava em state/; se alguém gravou no meio, refaz em cima da versão nova.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            python -m app.generate apply "$RUNNER_TEMP/patch.json" ${GEN_DATE:+--date "$GEN_DATE"}
            git add state
            if git diff --cached --quiet; then echo "Nada para salvar."; break; fi
            git commit -q -m "conteúdo: $MODE $(date -u +%F)"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then echo "Estado salvo."; break; fi
            sleep $((attempt * 3))
          done

      - name: Publicar mídias (branch "media", sem histórico)
        if: env.MODE != 'deploy'
        run: |
          python -m app.generate prune-media --media-dir media_repo/media
          # Um único commit sem histórico: o repositório não cresce com vídeos antigos.
          export GIT_INDEX_FILE="$RUNNER_TEMP/media.index"
          git --work-tree=media_repo add -A
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "mídias $(date -u +%F)")
          git push -q -f origin "$commit:refs/heads/media"

      - name: Publicar painel no Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CF_PAGES_PROJECT != ''
        run: |
          mkdir -p dist
          cp -r dashboard/public/. dist/
          cp -r media_repo/media dist/media
          cd dashboard
          npx --yes wrangler@4.140.0 pages deploy ../dist --project-name "$CF_PAGES_PROJECT" --branch main --commit-dirty=true

      - name: Aviso de configuração
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CF_PAGES_PROJECT == ''
        run: echo "::warning::Painel não publicado. Configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (Secrets) e CF_PAGES_PROJECT (Variables). Veja docs/PASSO-A-PASSO.md"
