# Publicação automática: posta nas redes os posts APROVADOS cujo horário chegou.
# Quem dispara no horário de cada post (e pede métricas quando ficam com mais de 3 h)
# é o Worker da Cloudflare (scheduler/worker.js). O cron abaixo, a cada 3 h, é só
# reserva se o Worker parar. Só publica nas redes ligadas em Configurações.
name: Publicar nas redes

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      post_id:
        description: "Publicar só este post (vazio = todos os que estão na hora)"
        type: string
        default: ""
      platform:
        description: "Só nesta rede (vazio = todas as ligadas)"
        type: choice
        options: ["", instagram, facebook, youtube, stories, tiktok]
        default: ""
      agora:
        description: "Publicar já, sem esperar o horário (precisa do ID do post)"
        type: choice
        options: ["false", "true"]
        default: "false"

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  issues: write   # resumo semanal (chega no seu e-mail)

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POST_ID: ${{ inputs.post_id }}
      ONLY_PLATFORM: ${{ inputs.platform }}
      NOW_FLAG: ${{ inputs.agora == 'true' && '--now' || '' }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || format('https://{0}.pages.dev', vars.CF_PAGES_PROJECT) }}
      MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ vars.META_PAGE_ID }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Baixar vídeos (usados no envio ao YouTube)
        run: |
          mkdir -p media_repo/media
          if git fetch -q --depth 1 origin media; then git archive FETCH_HEAD | tar -x -C media_repo; fi

      - name: Publicar
        run: python -m app.publish --media-dir media_repo/media --out "$RUNNER_TEMP/patch.json" ${POST_ID:+--post-id "$POST_ID"} ${ONLY_PLATFORM:+--platform "$ONLY_PLATFORM"} $NOW_FLAG

      # Salva logo depois de publicar (antes das métricas, que são lentas): se o job morrer
      # depois disso, a próxima execução já sabe o que saiu e não publica de novo.
      - name: Salvar publicação no painel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            python -m app.generate apply "$RUNNER_TEMP/patch.json"
            git add state config
            if git diff --cached --quiet; then echo "Nada para salvar."; exit 0; fi
            git commit -q -m "publicação $(date -u +'%F %H:%M')"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then echo "Salvo."; exit 0; fi
            sleep $((attempt * 3))
          done
          echo "::error::não consegui salvar o resultado da publicação depois de 5 tentativas; o próximo disparo pode publicar de novo"
          exit 1

      - name: Coletar métricas
        continue-on-error: true
        run: python -m app.metrics --out "$RUNNER_TEMP/metrics.json"

      - name: Salvar métricas e ajustar a grade
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            if [ -s "$RUNNER_TEMP/metrics.json" ]; then cp "$RUNNER_TEMP/metrics.json" state/metrics.json; fi
            # grade adaptativa: formato com alcance zero por 2 semanas cede 1 horário (app/adapt.py)
            python -m app.adapt --apply || echo "::warning::ajuste automático da grade falhou"
            git add state config
            if git diff --cached --quiet; then echo "Nada para salvar."; exit 0; fi
            git commit -q -m "métricas $(date -u +'%F %H:%M')"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then echo "Salvo."; exit 0; fi
            sleep $((attempt * 3))
          done
          echo "::warning::métricas não salvas depois de 5 tentativas"
          exit 1

      - name: Resumo semanal (segunda-feira; chega por e-mail)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Segunda-feira depois das 08h (Brasília), uma vez por semana: abre uma "issue" com o resumo.
          if [ "$(TZ=America/Sao_Paulo date +%u)" = "1" ] && [ "$(TZ=America/Sao_Paulo date +%H)" -ge 8 ]; then
            title="Resumo semanal - $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            existing=$(gh issue list --state all --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
            if [ -z "$existing" ]; then
              python -m app.report --out "$RUNNER_TEMP/resumo.md" --mention "$OWNER" \
                && gh issue create --title "$title" --body-file "$RUNNER_TEMP/resumo.md"
            fi
          fi

      - name: Avisar se alguma publicação falhou (e-mail do GitHub)
        if: always()
        run: python -m app.alert "$RUNNER_TEMP/patch.json"

      - name: Alerta de automação parada ou token expirando (abre issue → e-mail)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="⚠️ Alerta: a automação precisa de atenção"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          set +e
          python -m app.health --out "$RUNNER_TEMP/alerta.md" --mention "$OWNER" --snapshot "$RUNNER_TEMP/health.json"
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then
            if [ -n "$open" ]; then gh issue close "$open" --comment "✅ Tudo normal de novo: publicação em dia e tokens válidos."; fi
          elif [ "$rc" = "3" ]; then
            sig=$(head -n 1 "$RUNNER_TEMP/alerta.md")
            if [ -z "$open" ]; then
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/alerta.md"
            elif ! gh issue view "$open" --json body,comments --jq '[.body] + [.comments[].body] | join("\n")' | grep -qF "$sig"; then
              gh issue comment "$open" --body-file "$RUNNER_TEMP/alerta.md"   # o problema mudou
            fi
          else
            echo "::warning::a verificação de saúde falhou (código $rc)"
          fi

      # Resumo da aba "Hoje" do painel (state/health.json): problemas, contadores e o calendário.
      - name: Salvar resumo de saúde no painel
        if: always()
        continue-on-error: true
        run: |
          if [ ! -s "$RUNNER_TEMP/health.json" ]; then echo "Sem resumo para salvar."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            python -m app.health --install "$RUNNER_TEMP/health.json"
            git add state/health.json
            if git diff --cached --quiet; then echo "Nada para salvar."; exit 0; fi
            git commit -q -m "saúde $(date -u +'%F %H:%M')"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then echo "Salvo."; exit 0; fi
            sleep $((attempt * 3))
          done
          echo "::warning::resumo de saúde não salvo depois de 5 tentativas"
