# Publicação automática: posta nas redes os posts APROVADOS cujo horário chegou.
# Roda de hora em hora (05:07 às 23:07 de Brasília) e logo depois de cada
# aprovação no painel. Só publica nas redes ligadas em Configurações.
name: Publicar nas redes

on:
  schedule:
    - cron: "7 0-2,8-23 * * *"
  workflow_dispatch:
    inputs:
      post_id:
        description: "Publicar só este post (vazio = todos os que estão na hora)"
        type: string
        default: ""
      platform:
        description: "Só nesta rede (vazio = todas as ligadas)"
        type: choice
        options: ["", instagram, facebook, youtube]
        default: ""
      agora:
        description: "Publicar já, sem esperar o horário (precisa do ID do post)"
        type: choice
        options: ["false", "true"]
        default: "false"

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POST_ID: ${{ inputs.post_id }}
      ONLY_PLATFORM: ${{ inputs.platform }}
      NOW_FLAG: ${{ inputs.agora == 'true' && '--now' || '' }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || format('https://{0}.pages.dev', vars.CF_PAGES_PROJECT) }}
      MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ vars.META_PAGE_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Baixar vídeos (usados no envio ao YouTube)
        run: |
          mkdir -p media_repo/media
          if git fetch -q --depth 1 origin media; then git archive FETCH_HEAD | tar -x -C media_repo; fi

      - name: Publicar
        run: python -m app.publish --media-dir media_repo/media --out "$RUNNER_TEMP/patch.json" ${POST_ID:+--post-id "$POST_ID"} ${ONLY_PLATFORM:+--platform "$ONLY_PLATFORM"} $NOW_FLAG

      - name: Salvar resultado no painel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            python -m app.generate apply "$RUNNER_TEMP/patch.json"
            git add state
            if git diff --cached --quiet; then echo "Nada para salvar."; break; fi
            git commit -q -m "publicação $(date -u +'%F %H:%M')"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then echo "Salvo."; break; fi
            sleep $((attempt * 3))
          done
